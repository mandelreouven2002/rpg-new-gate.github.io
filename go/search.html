<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>השער - פורטל חיפוש קהילות</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/image_e42063.jpg">

    <style>
        body { font-family: 'Assistant', sans-serif; scroll-behavior: smooth; display: flex; flex-direction: column; min-height: 100vh; }
        .card { transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .filter-btn.active { background-color: #4f46e5; color: white; }
        #background-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-image: url('/rpg-bg.png'); background-repeat: repeat; opacity: 0.025; pointer-events: none; }
    </style>
</head>

<body class="bg-amber-50 text-stone-800">
<div id="background-overlay"></div>

<!-- ה-Header יוזרק לכאן אוטומטית ע"י layout.js -->

<main class="container mx-auto p-4 md:p-8 flex-grow">
    <section class="text-center mb-10 pt-6">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-stone-900">פורטל החיפוש</h1>
        <p class="max-w-2xl mx-auto text-xl text-stone-600 mb-8">
            חפשו קבוצות, חנויות, כנסים ופעילויות בכל הארץ במקום אחד מרוכז.
        </p>

        <div class="max-w-2xl mx-auto mb-8 relative">
            <input type="text" id="main-search-input" placeholder="מה אתם מחפשים? (שם, עיר, סוג משחק...)" class="w-full p-4 pr-12 text-lg border-2 border-indigo-200 rounded-full shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
        </div>

        <div class="flex justify-center items-center gap-3 flex-wrap" id="filters-container">
            <button class="filter-btn active px-4 py-2 rounded-full font-semibold bg-white shadow-sm border text-base" data-filter="all">הכל</button>
            <button class="filter-btn px-4 py-2 rounded-full font-semibold bg-white shadow-sm border text-base" data-filter="organization">🏢 ארגון/עמותה</button>
            <button class="filter-btn px-4 py-2 rounded-full font-semibold bg-white shadow-sm border text-base" data-filter="event">📅 אירוע/כנס</button>
            <button class="filter-btn px-4 py-2 rounded-full font-semibold bg-white shadow-sm border text-base" data-filter="group">💬 קהילה/קבוצה</button>
            <button class="filter-btn px-4 py-2 rounded-full font-semibold bg-white shadow-sm border text-base" data-filter="store">🛍️ חנות/ציוד</button>
            <button class="filter-btn px-4 py-2 rounded-full font-semibold bg-white shadow-sm border text-base" data-filter="venue">🏰 מתחם משחקים</button>
        </div>
    </section>

    <section id="results-section">
        <div id="results-count" class="text-stone-500 text-center mb-4 hidden">נמצאו <span id="count-number" class="font-bold">0</span> תוצאות</div>
        
        <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-10 text-stone-500">טוען נתונים...</div>
        </div>

        <div id="no-results" class="hidden text-center py-12">
            <h3 class="text-2xl font-bold text-stone-700 mb-2">לא נמצאו תוצאות</h3>
            <button id="clear-search-btn" class="mt-4 text-indigo-600 font-semibold hover:underline">נקה חיפוש</button>
        </div>
    </section>
</main>

<!-- טעינת ה-JS מתיקיית האב -->
<script src="/layout.js"></script>
<!-- מניח שקובץ הלוגיקה שלך נמצא ליד עמוד החיפוש -->
<script src="search-engine.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('results-container');
        const searchInput = document.getElementById('main-search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');
        let searchEngine = null;

        // טעינה לוקאלית מתוך תיקיית go
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const combined = [...(data.communityData || []), ...(data.resourcesData || [])];
                searchEngine = new SearchEngine(combined, data.regions || []);
                runSearch('all');
            });

        function runSearch(filterType) {
            if(!searchEngine) return;
            const query = searchInput.value;
            const results = searchEngine.search(query, filterType);
            
            if(results.length === 0) {
                container.innerHTML = '';
                document.getElementById('no-results').classList.remove('hidden');
            } else {
                document.getElementById('no-results').classList.add('hidden');
                container.innerHTML = results.map(item => `
                    <a href="${item.link}" target="_blank" class="card block bg-white p-6 rounded-lg shadow-lg border">
                        <h3 class="text-xl font-bold text-stone-800">${item.name}</h3>
                        ${item.location ? `<p class="text-sm text-stone-500 mt-2">📍 ${item.location}</p>` : ''}
                        <p class="mt-2">${item.description || ''}</p>
                    </a>
                `).join('');
            }
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                runSearch(btn.dataset.filter);
            });
        });

        searchInput.addEventListener('input', () => {
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            runSearch(activeFilter);
        });
    });
</script>
</body>
</html>
