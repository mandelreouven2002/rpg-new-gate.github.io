<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>השער - מאמרים ומדריכים</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/image_e42063.jpg">

  <style>
      body { font-family: 'Assistant', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
      .card { transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; }
      .card:hover { transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
  </style>
</head>
<body class="bg-amber-50 text-stone-800">

<!-- ה-Header יוזרק לכאן אוטומטית ע"י layout.js מהשורש -->

<main class="container mx-auto p-4 md:p-8 flex-grow">
  <section class="text-center mb-12 pt-6">
    <h1 class="text-4xl md:text-5xl font-bold mb-4 text-stone-900">מאמרים ומדריכים</h1>
    <p class="max-w-2xl mx-auto text-xl text-stone-600 mb-6">העמיקו את הידע שלכם, ולמדו על משחקי תפקידים.</p>
  </section>

  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <a href="/articles/what-is-rpg" class="card block bg-white p-6 rounded-lg shadow-lg border border-stone-200">
      <h3 class="text-2xl font-bold text-stone-800 mb-3">מה זה משחקי תפקידים?</h3>
      <p class="text-stone-600">המדריך הבסיסי שמסביר את הקונספט של כניסה לנעלי דמות אחרת.</p>
    </a>
    <a href="/articles/tabletop-rpg" class="card block bg-white p-6 rounded-lg shadow-lg border border-stone-200">
      <h3 class="text-2xl font-bold text-stone-800 mb-3">משחק שולחני (TTRPG)</h3>
      <p class="text-stone-600">איך משחקים עם דף, עפרון וקוביות סביב השולחן.</p>
    </a>
    <a href="/articles/larp-explained" class="card block bg-white p-6 rounded-lg shadow-lg border border-stone-200">
      <h3 class="text-2xl font-bold text-stone-800 mb-3">משחק חי (LARP)</h3>
      <p class="text-stone-600">לצאת מהשולחן וללבוש תחפושת.</p>
    </a>
  </section>

  <hr class="my-16 border-t-2 border-stone-300 rounded">

  <section>
    <div class="text-center mb-8">
      <h2 class="text-4xl font-bold text-stone-900 mb-4">שיטות ומשחקים</h2>
    </div>
    <div id="dynamic-systems-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div id="loading-systems" class="col-span-full text-center text-stone-500 py-8">טוען שיטות משחק...</div>
    </div>
  </section>
</main>

<script src="/layout.js"></script>

<script>
  const systemFiles = [
    'dungeons_and_dragons.md', 'pathfinder2.md', 'Savage-Worlds.md',
    'Savage-Pathfinder.md', 'Blades-in-the-Dark.md', 'Apocalypse-World.md', 'call-of-cthulhu.md'
  ];

  async function loadSystemsCards() {
    const grid = document.getElementById('dynamic-systems-grid');
    let cardsHTML = '';

    for (const filename of systemFiles) {
      try {
        // טעינה מקומית מתוך תיקיית files שבתוך articles
        const response = await fetch(`files/${filename}`);
        if (!response.ok) continue;

        const text = await response.text();
        let title = filename.replace('.md', '').replace(/-/g, ' ');
        const titleMatch = text.match(/^(#{1})\s+(.+)$/m);
        if (titleMatch) title = titleMatch[2].trim();

        cardsHTML += `
            <a href="system.html#${filename.replace('.md', '')}" class="card block bg-white p-6 rounded-lg shadow border hover:border-purple-400">
                <span class="bg-purple-100 text-purple-800 text-xs px-2 rounded mb-2 inline-block">שיטת משחק</span>
                <h3 class="text-xl font-bold text-stone-800 mb-2">${title}</h3>
                <p class="text-sm text-stone-600">לחץ כאן למעבר לעמוד השיטה המלאה וקריאת התוכן.</p>
            </a>
        `;
      } catch (error) { console.error(error); }
    }

    grid.innerHTML = cardsHTML || '<div class="col-span-full text-center">אין שיטות משחק זמינות.</div>';
  }

  window.addEventListener('DOMContentLoaded', loadSystemsCards);
</script>
</body>
</html>
